<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Love Particle</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #030313;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }

    video {
      position: fixed;
      opacity: 0;
      pointer-events: none;
      width: 1px;
      height: 1px;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #030313;
    }

    .info {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      font-size: 14px;
      text-align: center;
      box-shadow: 0 0 24px rgba(255, 80, 210, 0.28);
    }

    .start {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #25114a, #060616 75%);
    }

    .start button {
      border: 0;
      border-radius: 999px;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #ff4fd8, #7c4dff, #00d4ff);
      box-shadow: 0 0 40px rgba(255, 79, 216, 0.55);
    }
  </style>
</head>
<body>
  <div class="start" id="startScreen">
    <button id="startBtn">Mulai Efek Love ✨</button>
  </div>

  <div class="info" id="info">Kamera hanya untuk deteksi tangan, gambar kamera tidak ditampilkan</div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const info = document.getElementById("info");
    const startScreen = document.getElementById("startScreen");
    const startBtn = document.getElementById("startBtn");

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    const particles = [];
    const stars = [];
    const bursts = [];
    const rings = [];

    let loveActive = false;
    let handX = width / 2;
    let handY = height / 2;
    let smoothHandX = width / 2;
    let smoothHandY = height / 2;
    let time = 0;
    let camera = null;

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * devicePixelRatio;
      canvas.height = height * devicePixelRatio;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      createStars();
    }

    window.addEventListener("resize", resize);
    resize();

    function createStars() {
      stars.length = 0;
      const count = Math.floor((width * height) / 12000);stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: random(0.6, 2.2),
          hue: random(180, 330),
          speed: random(0.15, 0.7),
          twinkle: random(0, Math.PI * 2)
        });
      }
    }

    function heartPoint(t, centerX, centerY, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: centerX + x * scale, y: centerY + y * scale };
    }

    function createLoveParticles(startX, startY) {
      particles.length = 0;
      const scale = Math.min(width, height) * 0.022;

      for (let i = 0; i < 750; i++) {
        const t = for (let i = 0; i < 360; i++)        const target = heartPoint(t, startX, startY - 110, scale);

        particles.push({

          y: startY + random(-140, 140),
          offsetX: target.x - startX,
          offsetY: target.y - (startY - 110),
          tx: target.x,
          ty: target.y,
          size: random(1.8, 4.8),
          ,
          hue: random(0, 360),
          glow: rspeed: random(0.12, 0.22)h.PI * 2),
          orbitSize: random(4, 1glow: random(8, 18) }tX, startY - 60, 80);
      rings.push({ x: startX,orbitSize: random(3, 12)life: 1, hue: random(280, 340) });
    }

    function createBurst(x, y, count = 40) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = random(2, 9);
        bursts.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: random(0.015, 0.035),
          size: random(2, 6),
          hue: random(0, 360)
        });
      }
    }

    function isOpenPalm(landmarks) {
      const tips = [8, 12, 16, 20];
      const pips = [6, 10, 14, 18];
      let openFingers = 0;
      for (let i = 0; i < tips.length; i++) {
        if (landmarks[tips[i]].y < landmarks[pips[i]].y) openFingers++;
      }
      return openFingers >= 4;
    }

    function drawBackground() {
      const g = ctx.createRadialGradient(
        smoothHandX, smoothHandY, 20,
        smoothHandX, smoothHandY, Math.max(width, height) * 0.9
      );

      g.addColorStop(0, loveActive ? "rgba(95, 20, 120, 0.95)" : "rgba(25, 12, 55, 0.95)");
      g.addColorStop(0.45, "rgba(7, 8, 35, 0.96)");
      g.addColorStop(1, "rgba(3, 3, 19, 1)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, width, height);

      for (const s of stars) {
        s.y += s.speed;
        s.twinkle += 0.04;
        if (s.y > height + 10) {
          s.y = -10;
          s.x = Math.random() * width;
        }

        const alpha = 0.35 + Math.sin(s.twinkle) * 0.25;
        ctx.beginPath();
        ctx.shadowBlur = 10;
        ctx.shadowColor = `hsla(${s.hue}, 100%, 70%, ${alpha})`;
        ctx.fillStyle = `hsla(${s.hue}, 100%, 75%, ${alpha})`;
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function drawHandAura() {
      if (!loveActive) return;

      for (let i = 0; i < 3; i++) {
        const radius = 90 + i * 42 + Math.sin(time * 0.14 + i) * 18;
        ctx.beginPath();
        ctx.strokeStyle = `hsla($const radius = 70 + i * 34 + Math.sin(time * 0.14 + i) * 12;dowColor = `hsl(${300 + i * 25}, 100%, 65%)`;
        ctx.arc(smoothHandX, smoothHandY, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 18;unction drawParticles() {
      smoothHandX += (handX - smoothHandX) * 0.38;
      smoothHandY += (handY - smoothHandY) * 0.38;

      for (const p of particles) {
        if (loveActive) {
          p.orbit += 0.16;
          p.tx = smoothHandX + p.offsetX + Math.cos(p.orbit) * p.orbitSize;
          p.ty = smoothHandY - 110 + p.offsetY + Math.sin(p.orbit) * p.orbitSize;
        } else {
          p.tx += random(-10, 10);
          p.ty += random(-10, 10);
        }

        p.x += (p.tx - p.x) * p.speed;
        p.y += (p.ty - p.y) * p.speed;
        p.hue += 1.8;

        ctx.beginPath();
        ctx.shadowBlur = p.glow;
        ctx.shadowColor = `hsl(${p.hue}, 10();
        ctx.shadowBlur = 0;
      }
    }

    function drawBursts() {
      for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vx *= 0.97;
        b.vy *= 0.97;
        b.life -= b.decay;

        ctx.beginPath();
        ctx.shadowBlur = 20;
        ctx.shadowColor = `hsla(${b.hue}, 100%, 70%, ${b.life})`;
        ctx.fillStyle = `hsla(${b.hue}, 100%, 70%, ${b.life})`;
        ctx.arc(b.x, b.y, b.size * b.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        if (b.life <= 0) bursts.splice(i, 1);
      }
    }

    function drawRings() {
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i];
        r.r += 4.2;
        r.life -= 0.018;
        ctx.beginPath();
        ctx.strokeStyle = `hsla(${r.hue}, 100%, 70%, ${r.life})`;
        ctx.lineWidth = 4;
        ctx.shadowBlur = 24;
        ctx.shadowColor = `hsl(${r.hue}, 100%, 65%)`;
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
        if (r.life <= 0) rings.splice(i, 1);
      }
    }

    function drawMiniHearts() {
      if (!loveActive) return;

      for (let i = 0; i < 6; i++) {
        const a = time * 0.018 + i * Math.PI * 0.33;
        const x = smoothHandX + Math.cos(a) * (12tx.font = `${28 + i * 2}px Arial`;
        ctx.globalAlpha = 0.75;
        ctx.fillText("💖", x, y);
        ctx.globalAlpha = 1;

      if (!loveActive) return;

      for (let i = 0; i < 4; i++)ra();
      drawRings();
      drawParticles();
      drawBursts();
      drawMiniHearts();
      requestAnimationFrame(animate);
    }

    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults(results => {
      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        info.textContent = "Tangan belum terdeteksi";
        loveActive = false;
        return;
      }

      const landmarks = results.multiHandLandmarks[0];
      const wrist = landmarks[0];
      handX = width - wrist.x * width;
      handY = wrist.y * height;

      if (isOpenPalm(landmarks)) {
        info.textContent = "Telapak terbuka 🖐️ Love mengikuti tangan 💖";
        if (!loveActive) {
          createLoveParticles(handX, handY);
          loveActive = true;
        }

        if (time % 6 === 0) {
          createBurst(smoothHandX + random(-90- 110 + random(-90, 90), 28);
   othHandY - 90, r: 10, life: 1, hue: random(260, 360) });
        }
      } else {
        info.textConteangan untuk membuat love";
        loveActive = false;
      }
    });

    async function startApp() {
      startScreen.style.display = "none";
      info.textContent = "Meminta izin kamera...";

      camera = new if (time % 14 === 0)     onFrame:createBurst(smoothHandX + random(-80, 80), smoothHandY - 110 + random(-80, 80), 12);h: 640,
        heigif (time % 45 === 0)     camera.start();
      animate();
    }

    startBtn.addEventListener("click", startApp);
  </script>
</body>
</html>
