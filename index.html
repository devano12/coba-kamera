<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Love Particle</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #030313;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
      touch-action: none;
    }
    video {
      position: fixed;
      opacity: 0;
      pointer-events: none;
      width: 1px;
      height: 1px;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #030313;
    }
    .info {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      font-size: 14px;
      text-align: center;
      max-width: 92vw;
    }
    .start {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #25114a, #060616 75%);
    }
    .start button {
      border: 0;
      border-radius: 999px;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #ff4fd8, #7c4dff, #00d4ff);
      box-shadow: 0 0 30px rgba(255, 79, 216, 0.45);
    }
  </style>
</head>
<body>
  <div class="start" id="startScreen">
    <button id="startBtn">Mulai Efek Love ✨</button>
  </div>

  <div class="info" id="info">Kamera hanya untuk deteksi tangan, gambar kamera tidak ditampilkan</div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    const info = document.getElementById("info");
    const startScreen = document.getElementById("startScreen");
    const startBtn = document.getElementById("startBtn");

    let width = window.innerWidth;
    let height = window.innerHeight;
    let pixelRatio = 1;

    const particles = [];
    const stars = [];
    const bursts = [];
    const rings = [];

    let loveActive = false;
    let handX = width / 2;
    let handY = height / 2;
    let smoothHandX = width / 2;
    let smoothHandY = height / 2;
    let time = 0;
    let isProcessing = false;
    let lastDetectTime = 0;
    let appStarted = false;

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;

      // Penting untuk iPhone: jangan pakai devicePixelRatio tinggi karena bisa freeze.
      pixelRatio = Math.min(window.devicePixelRatio || 1, 1.25);

      canvas.width = Math.floor(width * pixelRatio);
      canvas.height = Math.floor(height * pixelRatio);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      createStars();
    }

    window.addEventListener("resize", resize);
    resize();

    function createStars() {
      stars.length = 0;
      const count = Math.min(70, Math.floor((width * height) / 16000));
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: random(0.7, 1.8),
          hue: random(180, 330),
          speed: random(0.12, 0.45),
          twinkle: random(0, Math.PI * 2)
        });
      }
    }

    function heartPoint(t, centerX, centerY, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: centerX + x * scale, y: centerY + y * scale };
    }

    function createLoveParticles(startX, startY) {
      particles.length = 0;
      const scale = Math.min(width, height) * 0.02;
      const total = 260;

      for (let i = 0; i < total; i++) {
        const t = Math.random() * Math.PI * 2;
        const target = heartPoint(t, startX, startY - 100, scale);
        particles.push({
          x: startX + random(-90, 90),
          y: startY + random(-90, 90),
          offsetX: target.x - startX,
          offsetY: target.y - (startY - 100),
          tx: target.x,
          ty: target.y,
          size: random(2, 4.5),
          speed: random(0.14, 0.26),
          hue: random(0, 360),
          orbit: random(0, Math.PI * 2),
          orbitSize: random(2, 9)
        });
      }

      createBurst(startX, startY - 60, 28);
      rings.push({ x: startX, y: startY - 90, r: 10, life: 1, hue: random(280, 340) });
    }

    function createBurst(x, y, count = 12) {
      const limit = 70;
      for (let i = 0; i < count; i++) {
        if (bursts.length > limit) bursts.shift();
        const angle = Math.random() * Math.PI * 2;
        const speed = random(2, 6);
        bursts.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: random(0.035, 0.055),
          size: random(2, 5),
          hue: random(0, 360)
        });
      }
    }

    function isOpenPalm(landmarks) {
      const tips = [8, 12, 16, 20];
      const pips = [6, 10, 14, 18];
      let openFingers = 0;
      for (let i = 0; i < tips.length; i++) {
        if (landmarks[tips[i]].y < landmarks[pips[i]].y) openFingers++;
      }
      return openFingers >= 4;
    }

    function drawBackground() {
      const g = ctx.createRadialGradient(smoothHandX, smoothHandY, 20, smoothHandX, smoothHandY, Math.max(width, height));
      g.addColorStop(0, loveActive ? "rgb(70, 18, 95)" : "rgb(18, 12, 48)");
      g.addColorStop(0.45, "rgb(7, 8, 35)");
      g.addColorStop(1, "rgb(3, 3, 19)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, width, height);

      for (const s of stars) {
        s.y += s.speed;
        s.twinkle += 0.04;
        if (s.y > height + 10) {
          s.y = -10;
          s.x = Math.random() * width;
        }
        const alpha = 0.35 + Math.sin(s.twinkle) * 0.25;
        ctx.fillStyle = `hsla(${s.hue}, 100%, 75%, ${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawHandAura() {
      if (!loveActive) return;
      for (let i = 0; i < 2; i++) {
        const radius = 65 + i * 34 + Math.sin(time * 0.14 + i) * 10;
        ctx.beginPath();
        ctx.strokeStyle = `hsla(${300 + i * 25}, 100%, 70%, ${0.28 - i * 0.08})`;
        ctx.lineWidth = 3;
        ctx.arc(smoothHandX, smoothHandY, radius, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawParticles() {
      smoothHandX += (handX - smoothHandX) * 0.42;
      smoothHandY += (handY - smoothHandY) * 0.42;

      for (const p of particles) {
        if (loveActive) {
          p.orbit += 0.16;
          p.tx = smoothHandX + p.offsetX + Math.cos(p.orbit) * p.orbitSize;
          p.ty = smoothHandY - 100 + p.offsetY + Math.sin(p.orbit) * p.orbitSize;
        }

        p.x += (p.tx - p.x) * p.speed;
        p.y += (p.ty - p.y) * p.speed;
        p.hue += 2.4;

        ctx.fillStyle = `hsl(${p.hue}, 100%, 67%)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawBursts() {
      for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vx *= 0.94;
        b.vy *= 0.94;
        b.life -= b.decay;
        ctx.fillStyle = `hsla(${b.hue}, 100%, 70%, ${b.life})`;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size * b.life, 0, Math.PI * 2);
        ctx.fill();
        if (b.life <= 0) bursts.splice(i, 1);
      }
    }

    function drawRings() {
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i];
        r.r += 5;
        r.life -= 0.035;
        ctx.beginPath();
        ctx.strokeStyle = `hsla(${r.hue}, 100%, 70%, ${r.life})`;
        ctx.lineWidth = 3;
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.stroke();
        if (r.life <= 0) rings.splice(i, 1);
      }
    }

    function drawMiniHearts() {
      if (!loveActive) return;
      for (let i = 0; i < 4; i++) {
        const a = time * 0.035 + i * Math.PI * 0.45;
        const x = smoothHandX + Math.cos(a) * (110 + i * 8);
        const y = smoothHandY - 100 + Math.sin(a * 1.4) * (70 + i * 5);
        ctx.font = `${24 + i * 2}px Arial`;
        ctx.globalAlpha = 0.85;
        ctx.fillText("💖", x, y);
        ctx.globalAlpha = 1;
      }
    }

    function animate() {
      time++;
      drawBackground();
      drawHandAura();
      drawRings();
      drawParticles();
      drawBursts();
      drawMiniHearts();
      requestAnimationFrame(animate);
    }

    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults(results => {
      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        info.textContent = "Tangan belum terdeteksi";
        loveActive = false;
        return;
      }

      const landmarks = results.multiHandLandmarks[0];
      const wrist = landmarks[0];
      handX = width - wrist.x * width;
      handY = wrist.y * height;

      if (isOpenPalm(landmarks)) {
        info.textContent = "Telapak terbuka 🖐️ Love mengikuti tangan 💖";
        if (!loveActive) {
          createLoveParticles(handX, handY);
          loveActive = true;
        }
        if (time % 20 === 0) createBurst(smoothHandX + random(-70, 70), smoothHandY - 100 + random(-70, 70), 8);
        if (time % 60 === 0 && rings.length < 3) rings.push({ x: smoothHandX, y: smoothHandY - 90, r: 10, life: 1, hue: random(260, 360) });
      } else {
        info.textContent = "Buka telapak tangan untuk membuat love";
        loveActive = false;
      }
    });

    async function detectionLoop() {
      if (!appStarted) return;

      const now = performance.now();
      // Deteksi tangan dibatasi sekitar 12 FPS supaya HP tidak freeze.
      if (!isProcessing && now - lastDetectTime > 83 && video.readyState >= 2) {
        isProcessing = true;
        lastDetectTime = now;
        try {
          await hands.send({ image: video });
        } catch (err) {
          console.log(err);
        }
        isProcessing = false;
      }

      requestAnimationFrame(detectionLoop);
    }

    async function startApp() {
      startScreen.style.display = "none";
      info.textContent = "Meminta izin kamera...";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 320 },
            height: { ideal: 240 },
            frameRate: { ideal: 15, max: 20 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        appStarted = true;
        info.textContent = "Buka telapak tangan untuk membuat love";
        animate();
        detectionLoop();
      } catch (err) {
        info.textContent = "Kamera gagal dibuka. Pastikan izin kamera aktif dan buka lewat HTTPS/GitHub Pages.";
        console.log(err);
      }
    }

    startBtn.addEventListener("click", startApp);
  </script>
</body>
</html>
