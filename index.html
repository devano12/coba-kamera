<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Love Particle</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050510;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }

    video {
      display: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #191933, #050510 70%);
    }

    .info {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="info" id="info">Izinkan kamera, lalu buka telapak tangan 🖐️</div>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const info = document.getElementById("info");

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    const particles = [];
    let loveActive = false;
    let handX = width / 2;
    let handY = height / 2;

    window.addEventListener("resize", () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    });

    function heartPoint(t, scale = 12) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t)
      );

      return {
        x: width / 2 + x * scale,
        y: height / 2 + y * scale
      };
    }

    function createLoveParticles(startX, startY) {
      particles.length = 0;

      for (let i = 0; i < 260; i++) {
        const t = Math.random() * Math.PI * 2;
        const target = heartPoint(t, Math.min(width, height) * 0.018);

        particles.push({
          x: startX + (Math.random() - 0.5) * 120,
          y: startY + (Math.random() - 0.5) * 120,
          tx: target.x,
          ty: target.y,
          size: Math.random() * 3 + 2,
          speed: Math.random() * 0.035 + 0.02,
          hue: Math.random() * 360,
          glow: Math.random() * 20 + 10
        });
      }
    }

    function isOpenPalm(landmarks) {
      const tips = [8, 12, 16, 20];
      const pips = [6, 10, 14, 18];

      let openFingers = 0;

      for (let i = 0; i < tips.length; i++) {
        if (landmarks[tips[i]].y < landmarks[pips[i]].y) {
          openFingers++;
        }
      }

      return openFingers >= 4;
    }

    function drawParticles() {
      for (const p of particles) {
        p.x += (p.tx - p.x) * p.speed;
        p.y += (p.ty - p.y) * p.speed;
        p.hue += 1.2;

        ctx.beginPath();
        ctx.shadowBlur = p.glow;
        ctx.shadowColor = `hsl(${p.hue}, 100%, 65%)`;
        ctx.fillStyle = `hsl(${p.hue}, 100%, 65%)`;
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function drawBackground() {
      ctx.fillStyle = "rgba(5, 5, 16, 0.25)";
      ctx.fillRect(0, 0, width, height);
    }

    function renderCameraToCanvas() {
      ctx.save();
      ctx.globalAlpha = 0.2;
      ctx.translate(width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, width, height);
      ctx.restore();
    }

    function animate() {
      drawBackground();
      renderCameraToCanvas();
      drawParticles();
      requestAnimationFrame(animate);
    }

    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults(results => {
      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        info.textContent = "Tangan belum terdeteksi";
        loveActive = false;
        return;
      }

      const landmarks = results.multiHandLandmarks[0];
      const wrist = landmarks[0];

      handX = width - wrist.x * width;
      handY = wrist.y * height;

      if (isOpenPalm(landmarks)) {
        info.textContent = "Telapak terbuka 🖐️ Love muncul 💖";

        if (!loveActive) {
          createLoveParticles(handX, handY);
          loveActive = true;
        }
      } else {
        info.textContent = "Buka telapak tangan untuk membuat love";
        loveActive = false;
      }
    });

    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
      },
      width: 640,
      height: 480
    });

    camera.start();
    animate();
  </script>
</body>
</html>
